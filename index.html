function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;",
    '"':"&quot;", "'":"&#39;"
  }[char]));
}

function emailKey(value) {
  return String(value || "").trim().toLowerCase();
}

function isAdmin() {
  return currentUser &&
    ADMIN_EMAILS.some(email => emailKey(email) === emailKey(currentUser.email));
}

function isCreator(group) {
  return currentUser &&
    emailKey(group.created_by_email) === emailKey(currentUser.email);
}

function isCompleted(group) {
  return group.is_completed === true ||
    String(group.is_completed).trim().toLowerCase() === "true";
}

function membersOf(group) {
  const members = [];
  for (let i = 1; i <= MAX_MEMBERS; i++) {
    const id = String(group[`member${i}_id`] || "").trim();
    if (id) members.push({
      id,
      name: String(group[`member${i}_name`] || "ไม่ระบุชื่อ")
    });
  }
  return members;
}

function getRegistrationCount(fullId) {
  return allGroups.filter(group =>
    isCompleted(group) &&
    membersOf(group).some(member => member.id === String(fullId))
  ).length;
}

/* วันที่: ใช้ UTC เป็นค่าตัวแทนวัน และใช้กรุงเทพฯ หาวันปัจจุบัน */
function validDate(year, month, day) {
  year = Number(year);
  month = Number(month);
  day = Number(day);

  if (year >= 2400) year -= 543;
  if (year < 1900 || year > 2200) return null;

  const date = new Date(Date.UTC(year, month - 1, day));

  return date.getUTCFullYear() === year &&
    date.getUTCMonth() === month - 1 &&
    date.getUTCDate() === day ? date : null;
}

function todayBangkok() {
  const parts = new Intl.DateTimeFormat("en-US", {
    timeZone: "Asia/Bangkok",
    year: "numeric",
    month: "2-digit",
    day: "2-digit"
  }).formatToParts(new Date());

  const get = type => parts.find(part => part.type === type).value;
  return validDate(get("year"), get("month"), get("day"));
}

function startOfWeek(date) {
  return new Date(+date - ((date.getUTCDay() + 6) % 7) * DAY);
}

function formatDate(date, full = false) {
  const options = full
    ? { dateStyle: "full", timeZone: "UTC" }
    : { day: "numeric", month: "short", year: "numeric", timeZone: "UTC" };

  return new Intl.DateTimeFormat("th-TH", options).format(date);
}

function parseDutyDate(value) {
  let text = String(value ?? "").trim();

  if (Object.prototype.hasOwnProperty.call(DATE_OVERRIDES, text)) {
    const match = String(DATE_OVERRIDES[text])
      .match(/^(\d{4})-(\d{2})-(\d{2})$/);

    return match ? validDate(match[1], match[2], match[3]) : null;
  }

  text = text.replace(/[๐-๙]/g, n => "๐๑๒๓๔๕๖๗๘๙".indexOf(n));

  let match = text.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (match) return validDate(match[1], match[2], match[3]);

  match = text.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if (match) return validDate(match[3], match[2], match[1]);

  const monthNames = [
    ["มกราคม","มค"], ["กุมภาพันธ์","กพ"], ["มีนาคม","มีค"],
    ["เมษายน","เมย"], ["พฤษภาคม","พค"], ["มิถุนายน","มิย"],
    ["กรกฎาคม","กค"], ["สิงหาคม","สค"], ["กันยายน","กย"],
    ["ตุลาคม","ตุลา","ตค"], ["พฤศจิกายน","พย"], ["ธันวาคม","ธค"]
  ];

  const compact = text.replace(/[.\s]/g, "");

  const months = monthNames
    .map((names, index) =>
      names.some(name => compact.includes(name)) ? index + 1 : 0
    )
    .filter(Boolean);

  if (months.length !== 1) return null;

  const numbers = text.match(/\d+/g) || [];
  if (numbers.length < 1 || numbers.length > 2) return null;
  if (numbers[0].length > 2) return null;
  if (numbers.length === 2 && numbers[1].length !== 4) return null;

  const date = validDate(
    numbers[1] || LEGACY_YEAR,
    months[0],
    numbers[0]
  );

  if (!date) return null;

  const weekdayNames = [
    "อาทิตย์","จันทร์","อังคาร","พุธ","พฤหัสบดี","ศุกร์","เสาร์"
  ];

  const weekdays = weekdayNames
    .map((name, index) =>
      text.includes(name) || (index === 4 && text.includes("พฤหัส"))
        ? index : -1
    )
    .filter(index => index >= 0);

  if (weekdays.length > 1) return null;
  if (weekdays.length === 1 && date.getUTCDay() !== weekdays[0]) return null;

  return date;
}

function dateKey(value) {
  const date = parseDutyDate(value);
  return date ? date.toISOString().slice(0, 10) : String(value || "").trim();
}

/* ล็อกอิน */
function parseJwt(token) {
  let base64 = token.split(".")[1].replace(/-/g, "+").replace(/_/g, "/");
  base64 += "=".repeat((4 - base64.length % 4) % 4);

  const bytes = Uint8Array.from(atob(base64), char => char.charCodeAt(0));
  return JSON.parse(new TextDecoder().decode(bytes));
}

window.addEventListener("load", () => {
  resetMemberSlots();
  renderDashboard();
  icons();

  if (!window.google?.accounts?.id) {
    $("login-error").textContent =
      "โหลดระบบ Google ไม่สำเร็จ กรุณารีเฟรชหน้าเว็บ";
    return;
  }

  google.accounts.id.initialize({
    client_id: CLIENT_ID,
    callback: handleCredentialResponse,
    hd: ORG_DOMAIN
  });

  google.accounts.id.renderButton($("buttonDiv"), {
    theme: "outline",
    size: "large",
    shape: "pill",
    width: 260
  });
});

async function handleCredentialResponse(response) {
  try {
    const data = parseJwt(response.credential);
    const email = emailKey(data.email);

    if (
      !email.endsWith("@" + ORG_DOMAIN) ||
      data.hd !== ORG_DOMAIN ||
      data.email_verified !== true ||
      !data.exp ||
      data.exp * 1000 <= Date.now()
    ) {
      showToast("กรุณาใช้อีเมลมหาวิทยาลัย @" + ORG_DOMAIN, true);
      return;
    }

    sessionVersion++;
    currentUser = {
      name: data.name || data.email,
      email,
      picture: data.picture || ""
    };

    $("user-name-display").textContent = currentUser.name;
    const avatar = $("user-avatar");
    avatar.classList.add("hidden");

    try {
      const url = new URL(currentUser.picture);
      if (url.protocol === "https:") {
        avatar.src = url.href;
        avatar.classList.remove("hidden");
      }
    } catch (_) {}

    $("login-screen").classList.add("hidden");
    $("main-app").classList.remove("hidden");

    goToday();
    await fetchGroups();
  } catch (error) {
    showToast("เข้าสู่ระบบไม่สำเร็จ กรุณาลองใหม่", true);
  }
}

function handleLogout() {
  currentUser = null;
  sessionVersion++;
  requestVersion++;
  allGroups = [];
  availableDates = [];
  pendingGroups.clear();
  saving = false;
  dataState = "idle";
  editingGroupNum = null;

  window.google?.accounts?.id?.disableAutoSelect();

  $("main-app").classList.add("hidden");
  $("login-screen").classList.remove("hidden");

  cancelEdit();
  renderDashboard();
}

/* อ่านข้อมูล */
async function fetchGroups() {
  if (!currentUser || saving) return;

  const request = ++requestVersion;
  const session = sessionVersion;
  const selected = $("selected-date").value;

  dataState = "loading";
  renderDashboard();
  updateControls();

  try {
    const response = await fetch(GOOGLE_SCRIPT_URL, {
      cache: "no-store"
    });

    if (!response.ok) throw new Error("โหลดข้อมูลไม่สำเร็จ");

    const result = await response.json();

    if (!result.isOk || !Array.isArray(result.data)) {
      throw new Error(result.error || "รูปแบบข้อมูลไม่ถูกต้อง");
    }

    if (request !== requestVersion || session !== sessionVersion) return;

    allGroups = result.data;
    availableDates = Array.isArray(result.dates)
      ? [...new Set(result.dates.map(String).map(s => s.trim()).filter(Boolean))]
      : [];

    dataState = "ready";
    renderDateDropdown(selected);
    refreshMemberNames();
  } catch (error) {
    if (request !== requestVersion || session !== sessionVersion) return;
    dataState = "error";
    showToast("ดึงข้อมูลไม่สำเร็จ กรุณากดรีเฟรช", true);
  } finally {
    if (request === requestVersion && session === sessionVersion) {
      renderDashboard();
      updateControls();
    }
  }
}

/* หน้าแรกและตัวกรอง */
function changeWeek(offset) {
  selectedWeek = new Date(+selectedWeek + offset * 7 * DAY);
  viewMode = "week";
  renderDashboard();
}

function goToday() {
  selectedWeek = startOfWeek(todayBangkok());
  viewMode = "week";
  renderDashboard();
}

function changeView(value) {
  viewMode = value;
  renderDashboard();
}

function renderDashboard() {
  const today = todayBangkok();

  $("today-date").textContent = formatDate(today, true);
  $("view-mode").value = viewMode;

  $("week-label").textContent = viewMode === "week"
    ? `${formatDate(selectedWeek)} – ${formatDate(new Date(+selectedWeek + 6 * DAY))}`
    : viewMode === "unknown"
      ? "วันที่ต้องตรวจสอบ / ยังไม่เลือกวัน"
      : "รายชื่อกลุ่มทั้งหมด";

  $("loading-state").classList.toggle("hidden", dataState !== "loading");
  $("groups-list").replaceChildren();
  $("empty-msg").classList.add("hidden");
  $("total-summary").textContent = "";
  $("visible-summary").textContent = "";

  if (dataState !== "ready") {
    $("today-content").textContent = dataState === "error"
      ? "โหลดข้อมูลเวรไม่สำเร็จ กรุณากดรีเฟรชด้านล่าง"
      : "กำลังโหลดข้อมูลเวรวันนี้…";
    return;
  }

  const entries = allGroups.map(group => ({
    group,
    date: parseDutyDate(group.selected_date)
  }));

  const unknown = entries.filter(entry => !entry.date);
  const dueToday = entries.filter(entry => entry.date && +entry.date === +today);

  let todayHtml = "";

  if (dueToday.length) {
    todayHtml = dueToday.map(({ group }) => `
      <div class="rounded-2xl bg-white p-4 text-gray-800">
        <div class="flex flex-wrap items-center justify-between gap-2">
          <h3 class="text-lg font-bold text-orange-700">
            กลุ่มที่ ${escapeHtml(group.group_number)}
          </h3>
          <span class="text-xs font-semibold ${
            isCompleted(group) ? "text-green-600" : "text-amber-600"
          }">
            ${isCompleted(group) ? "✓ รับสวัสดิการแล้ว" : "รอการยืนยัน"}
          </span>
        </div>
        <ul class="mt-3 space-y-2">
          ${membersOf(group).map(member => `
            <li class="flex items-start gap-2 text-sm">
              <span class="rounded bg-orange-100 text-orange-700
                           px-2 py-0.5 font-bold shrink-0">
                ${escapeHtml(member.id.slice(-3))}
              </span>
              <span class="break-words">${escapeHtml(member.name)}</span>
            </li>
          `).join("")}
        </ul>
      </div>
    `).join("");
  } else {
    const openToday = availableDates.some(value => {
      const date = parseDutyDate(value);
      return date && +date === +today;
    });

    todayHtml = `
      <div class="rounded-xl bg-white/15 p-4 font-semibold">
        ${openToday
          ? "วันนี้มีวันเวรเปิดไว้ แต่ยังไม่มีกลุ่มลงทะเบียน"
          : "ไม่พบกลุ่มที่ระบุเวรตรงกับวันนี้"}
      </div>
    `;
  }

  if (unknown.length) {
    todayHtml += `
      <button type="button" data-show-unknown
              class="text-left text-xs underline underline-offset-4">
        อีก ${unknown.length} กลุ่มยังจัดวันไม่ได้ — กดตรวจสอบ
      </button>
    `;
  }

  $("today-content").innerHTML = todayHtml;
  $("today-content").querySelector("[data-show-unknown]")
    ?.addEventListener("click", () => {
      changeView("unknown");
      $("week-label").scrollIntoView({ behavior: "smooth", block: "center" });
    });

  $("total-summary").textContent =
    `ทั้งหมด ${allGroups.length} กลุ่ม · ยังจัดวันไม่ได้ ${unknown.length} กลุ่ม`;

  const visible = entries.filter(entry => {
    if (viewMode === "all") return true;
    if (viewMode === "unknown") return !entry.date;
    return entry.date &&
      +entry.date >= +selectedWeek &&
      +entry.date < +selectedWeek + 7 * DAY;
  }).sort((a, b) =>
    (a.date ? +a.date : Infinity) - (b.date ? +b.date : Infinity) ||
    Number(a.group.group_number) - Number(b.group.group_number)
  );

  $("visible-summary").textContent = `แสดง ${visible.length} กลุ่ม`;

  if (!visible.length) {
    $("empty-msg").textContent = viewMode === "week"
      ? "ยังไม่มีกลุ่มที่ระบุวันเวรในสัปดาห์นี้"
      : "ไม่มีรายการในมุมมองนี้";
    $("empty-msg").classList.remove("hidden");
  }

  visible.forEach(({ group, date }) => renderGroupCard(group, date));
  icons();
}

function renderGroupCard(group, date) {
  const done = isCompleted(group);
  const card = document.createElement("article");

  card.className =
    "rounded-2xl p-4 border flex flex-col gap-3 " +
    (done ? "border-green-200 bg-green-50/30" : "border-orange-100 bg-white");

  const dateText = date
    ? formatDate(date, true)
    : String(group.selected_date || "ยังไม่เลือกวัน");

  card.innerHTML = `
    <div class="flex flex-wrap justify-between items-center gap-2">
      <h3 class="font-bold text-orange-700">
        กลุ่มที่ ${escapeHtml(group.group_number)}
      </h3>
      <span class="text-xs rounded-full px-2 py-1 ${
        done ? "bg-green-100 text-green-700" : "bg-amber-50 text-amber-700"
      }">
        ${done ? "✓ รับสวัสดิการแล้ว" : "รอการยืนยัน"}
      </span>
    </div>

    <div class="text-sm font-semibold ${
      date ? "text-gray-600" : "text-amber-700"
    }">
      ${escapeHtml(dateText)}
      ${!date && group.selected_date
        ? '<p class="mt-1 text-xs font-normal">วันที่ยังไม่ครบ หรือวันไม่ตรงปฏิทิน</p>'
        : ""}
    </div>

    <ul class="space-y-2">
      ${membersOf(group).map(member => {
        const count = getRegistrationCount(member.id);
        return `
          <li class="rounded-xl bg-white/80 border border-gray-100 p-2.5">
            <div class="flex items-start gap-2">
              <span class="bg-orange-500 text-white rounded px-1.5
                           py-0.5 text-xs font-bold shrink-0">
                ${escapeHtml(member.id.slice(-3))}
              </span>
              <span class="text-sm break-words">${escapeHtml(member.name)}</span>
            </div>
            <p class="text-xs text-gray-500 mt-1.5">
              ${count ? `รับสวัสดิการแล้ว ${count} ครั้ง` : "ยังไม่เคยรับสวัสดิการ"}
            </p>
          </li>
        `;
      }).join("")}
    </ul>

    <p class="text-xs text-gray-400 break-words mt-auto">
      บันทึกโดย: ${escapeHtml(group.created_by_name || "ไม่ระบุ")}
    </p>
  `;

  const actions = document.createElement("div");
  actions.className = "flex flex-wrap gap-2";

  if (isCreator(group)) {
    const editButton = document.createElement("button");
    editButton.type = "button";
    editButton.textContent = "แก้ไขข้อมูล";
    editButton.className =
      "text-xs font-bold rounded-lg px-3 py-2 bg-orange-50 text-orange-700";
    editButton.disabled = saving;
    editButton.addEventListener("click", () => editGroup(group.group_number));
    actions.append(editButton);
  }

  if (isAdmin()) {
    const completeButton = document.createElement("button");
    completeButton.type = "button";
    completeButton.textContent = pendingGroups.has(String(group.group_number))
      ? "กำลังบันทึก…"
      : done ? "ยกเลิกการยืนยัน" : "ยืนยันการรับสวัสดิการ";

    completeButton.className =
      "text-xs font-bold rounded-lg px-3 py-2 " +
      (done ? "bg-green-100 text-green-700" : "bg-gray-100 text-gray-700");

    completeButton.disabled =
      saving || pendingGroups.has(String(group.group_number));

    completeButton.addEventListener("click", () =>
      toggleCompleteGroup(group.group_number)
    );
    actions.append(completeButton);
  }

  card.append(actions);
  $("groups-list").append(card);
}

/* ฟอร์มสมาชิก */
function addMemberSlot(value = "") {
  if ($("member-slots").children.length >= MAX_MEMBERS) return;

  const slot = document.createElement("div");
  slot.className = "member-slot bg-orange-50/40 border border-orange-100 p-3 rounded-xl";

  slot.innerHTML = `
    <div class="flex justify-between items-center mb-2">
      <label class="member-label text-xs font-semibold text-gray-500"></label>
      <button type="button" class="remove-member text-xs text-red-500">ลบ</button>
    </div>
    <div class="flex flex-col sm:flex-row gap-2 sm:items-center">
      <input type="text" inputmode="numeric" maxlength="3"
             placeholder="เช่น 001"
             class="w-28 px-3 py-2 border border-gray-200 rounded-lg
                    text-center font-bold tracking-widest bg-white
                    outline-none focus:ring-2 focus:ring-orange-300">
      <div class="member-name text-sm break-words"></div>
    </div>
  `;

  const input = slot.querySelector("input");
  input.value = value;
  input.addEventListener("input", () => {
    input.value = input.value.replace(/\D/g, "").slice(0, 3);
    updateMemberName(slot);
  });

  slot.querySelector(".remove-member").addEventListener("click", () => {
    if ($("member-slots").children.length <= 1) {
      showToast("ต้องมีสมาชิกอย่างน้อย 1 คน", true);
      return;
    }
    slot.remove();
    updateSlotLabels();
  });

  $("member-slots").append(slot);
  updateMemberName(slot);
  updateSlotLabels();
}

function updateSlotLabels() {
  document.querySelectorAll(".member-slot").forEach((slot, index) => {
    const input = slot.querySelector("input");
    input.id = `member-input-${index + 1}`;
    const label = slot.querySelector(".member-label");
    label.textContent = `สมาชิกคนที่ ${index + 1}`;
    label.htmlFor = input.id;
  });

  $("add-member-btn").disabled =
    $("member-slots").children.length >= MAX_MEMBERS;
}

function updateMemberName(slot) {
  const value = slot.querySelector("input").value;
  const output = slot.querySelector(".member-name");

  if (value.length !== 3) {
    output.textContent = "พิมพ์รหัสนิสิต 3 ตัวท้าย";
    output.className = "member-name text-sm text-gray-400";
    return;
  }

  if (!ROSTER[value]) {
    output.textContent = "ไม่พบรหัสนิสิตนี้";
    output.className = "member-name text-sm text-red-500";
    return;
  }

  const count = getRegistrationCount(PREFIX + value);
  output.className = "member-name text-sm text-gray-800";
  output.innerHTML = `
    <span class="font-semibold">${escapeHtml(ROSTER[value])}</span>
    <p class="text-xs text-gray-500 mt-1">
      ${count ? `รับสวัสดิการแล้ว ${count} ครั้ง` : "ยังไม่เคยรับสวัสดิการ"}
    </p>
  `;
}

function refreshMemberNames() {
  document.querySelectorAll(".member-slot").forEach(updateMemberName);
}

function resetMemberSlots() {
  $("member-slots").replaceChildren();
  for (let i = 0; i < MAX_MEMBERS; i++) addMemberSlot();
}

function renderDateDropdown(selected = $("selected-date").value) {
  const select = $("selected-date");
  select.replaceChildren(new Option("-- ไม่เลือก / ระบุภายหลัง --", ""));

  const taken = new Set(
    allGroups
      .filter(group => String(group.group_number) !== String(editingGroupNum))
      .map(group => group.selected_date)
      .filter(Boolean)
      .map(dateKey)
  );

  const options = [...availableDates];
  if (selected && !options.includes(selected)) options.push(selected);

  options.sort((a, b) => {
    const da = parseDutyDate(a), db = parseDutyDate(b);
    return (da ? +da : Infinity) - (db ? +db : Infinity);
  });

  options.forEach(value => {
    const date = parseDutyDate(value);
    const unavailable = taken.has(dateKey(value));

    const text = (date ? formatDate(date, true) : `${value} · ตรวจสอบวันที่`) +
      (unavailable ? " (มีกลุ่มเลือกแล้ว)" : "");

    const option = new Option(text, value);
    option.disabled = unavailable;
    select.append(option);
  });

  select.value = selected || "";
}

function editGroup(groupNum) {
  if (saving || dataState !== "ready") return;

  const group = allGroups.find(g => String(g.group_number) === String(groupNum));
  if (!group || !isCreator(group)) {
    showToast("แก้ไขได้เฉพาะกลุ่มที่ตนเองบันทึก", true);
    return;
  }

  editingGroupNum = group.group_number;
  $("member-slots").replaceChildren();

  const members = membersOf(group);
  if (members.length) {
    members.forEach(member => addMemberSlot(member.id.slice(-3)));
  } else {
    addMemberSlot();
  }

  renderDateDropdown(String(group.selected_date || ""));
  $("form-title").textContent = `แก้ไขกลุ่มที่ ${group.group_number}`;
  $("cancel-edit-btn").classList.remove("hidden");
  updateControls();

  $("form-section").scrollIntoView({ behavior: "smooth", block: "center" });
}

function cancelEdit() {
  if (saving) return;
  editingGroupNum = null;
  resetMemberSlots();
  renderDateDropdown("");
  $("form-title").textContent = "ลงทะเบียนกลุ่ม";
  $("cancel-edit-btn").classList.add("hidden");
  updateControls();
}

function updateControls() {
  $("form-fields").disabled = saving || dataState !== "ready";
  $("submit-btn").disabled = saving || dataState !== "ready";
  $("cancel-edit-btn").disabled = saving;
  $("refresh-btn").disabled = saving || dataState === "loading";

  $("submit-btn").textContent = saving
    ? "กำลังบันทึกข้อมูล…"
    : editingGroupNum !== null
      ? `บันทึกการแก้ไขกลุ่มที่ ${editingGroupNum}`
      : "ยืนยันการลงทะเบียนกลุ่ม";
}

/* ส่งข้อมูลตามรูปแบบ Apps Script เดิม */
async function postRecord(record) {
  const response = await fetch(GOOGLE_SCRIPT_URL, {
    method: "POST",
    body: JSON.stringify(record)
  });

  if (!response.ok) throw new Error("เชื่อมต่อเซิร์ฟเวอร์ไม่สำเร็จ");
  const result = await response.json();
  if (!result.isOk) throw new Error(result.error || "บันทึกข้อมูลไม่สำเร็จ");
  return result;
}

async function submitGroup() {
  if (!currentUser || saving || dataState !== "ready") return;

  const values = [...document.querySelectorAll("#member-slots input")]
    .map(input => input.value.trim())
    .filter(Boolean);

  if (!values.length) {
    showToast("กรุณากรอกสมาชิกอย่างน้อย 1 คน", true);
    return;
  }

  if (values.some(value => !/^\d{3}$/.test(value) || !ROSTER[value])) {
    showToast("กรุณาตรวจสอบรหัสนิสิตให้ครบ 3 หลัก", true);
    return;
  }

  if (new Set(values).size !== values.length) {
    showToast("มีสมาชิกซ้ำในกลุ่ม กรุณาตรวจสอบ", true);
    return;
  }

  const selectedDate = $("selected-date").value;
  const taken = selectedDate && allGroups.some(group =>
    String(group.group_number) !== String(editingGroupNum) &&
    group.selected_date &&
    dateKey(group.selected_date) === dateKey(selectedDate)
  );

  if (taken) {
    showToast("วันที่นี้มีกลุ่มเลือกแล้ว กรุณาเลือกวันอื่น", true);
    return;
  }

  const session = sessionVersion;
  const isUpdate = editingGroupNum !== null;
  const record = {
    action: isUpdate ? "update" : "create",
    group_number: editingGroupNum,
    selected_date: selectedDate,
    created_at: new Date().toLocaleString("th-TH", {
      timeZone: "Asia/Bangkok"
    }),
    created_by_name: currentUser.name,
    created_by_email: currentUser.email
  };

  for (let i = 1; i <= MAX_MEMBERS; i++) {
    const value = values[i - 1];
    record[`member${i}_id`] = value ? PREFIX + value : "";
    record[`member${i}_name`] = value ? ROSTER[value] : "";
  }

  saving = true;
  updateControls();
  renderDashboard();

  try {
    const result = await postRecord(record);
    if (session !== sessionVersion) return;

    saving = false;
    cancelEdit();

    const date = parseDutyDate(selectedDate);
    if (date) {
      selectedWeek = startOfWeek(date);
      viewMode = "week";
    } else {
      viewMode = "unknown";
    }

    showToast(
      `${isUpdate ? "แก้ไข" : "ลงทะเบียน"}กลุ่มที่ ${result.group_number} สำเร็จ`
    );
    await fetchGroups();
  } catch (error) {
    if (session === sessionVersion) {
      showToast(error.message + " หากไม่แน่ใจว่าบันทึกแล้วหรือไม่ ให้รีเฟรชก่อนส่งซ้ำ", true);
    }
  } finally {
    if (session === sessionVersion) {
      saving = false;
      updateControls();
      renderDashboard();
    }
  }
}

async function toggleCompleteGroup(groupNum) {
  if (!isAdmin() || saving || dataState !== "ready") return;

  const key = String(groupNum);
  if (pendingGroups.has(key)) return;

  const session = sessionVersion;
  pendingGroups.add(key);
  renderDashboard();

  try {
    await postRecord({
      action: "toggle_complete",
      group_number: groupNum
    });

    if (session !== sessionVersion) return;
    showToast("อัปเดตสถานะเรียบร้อย");
    await fetchGroups();
  } catch (error) {
    if (session === sessionVersion) {
      showToast("ไม่สามารถยืนยันผลการเปลี่ยนสถานะได้ กำลังโหลดสถานะล่าสุด", true);
      await fetchGroups();
    }
  } finally {
    if (session === sessionVersion) {
      pendingGroups.delete(key);
      renderDashboard();
    }
  }
}

function showToast(message, isError = false) {
  const toast = document.createElement("div");
  toast.className =
    "toast rounded-xl shadow-lg px-4 py-3 text-sm text-white " +
    "sm:max-w-md " + (isError ? "bg-red-500" : "bg-orange-600");
  toast.textContent = message;
  $("toast-container").append(toast);
  setTimeout(() => toast.remove(), isError ? 6500 : 3500);
}

/* อัปเดตวันที่เมื่อข้ามเที่ยงคืนประเทศไทย */
function checkNewDay() {
  const today = todayBangkok();
  if (+today === lastToday) return;

  const wasCurrentWeek = +selectedWeek === +startOfWeek(new Date(lastToday));
  lastToday = +today;

  if (wasCurrentWeek) selectedWeek = startOfWeek(today);

  renderDashboard();
  if (currentUser && !saving) fetchGroups();
}

setInterval(checkNewDay, 30000);

document.addEventListener("visibilitychange", () => {
  if (!document.hidden) checkNewDay();
});
</script>
